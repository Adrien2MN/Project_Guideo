[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guideo"
version = "0.1.0"
description = "Personalised multimodal journey planner for Paris (Vélib, IDFM/PRIM)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "networkx>=3.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["polars>=1.0", "pyarrow>=15"]
streets = ["osmnx>=2.0"]

[project.scripts]
guideo-velib-collector = "guideo.velib.collector:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
